name: vaultell
description: Local-first Australian personal insurance wallet.
publish_to: "none"
version: 0.1.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.19.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  local_auth: ^2.2.0
  url_launcher: ^6.3.0
  file_picker: ^12.1.1
  google_mlkit_text_recognition: ^0.17.1
  pdf_render: ^1.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.19.0
  build_runner: ^2.4.11
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/splash/splash_logo.png

flutter_native_splash:
  color: "#0D47A1"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0D47A1"
    image: assets/splash/splash_logo.png

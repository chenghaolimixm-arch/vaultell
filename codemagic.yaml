workflows:
  android-build:
    name: Android Build (AAB + APK)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android_signing
    scripts:
      - name: Set up Android release signing
        script: |
          cd app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > key.properties
          fi
      - name: Get packages
        script: cd app && flutter pub get
      - name: Build release AAB
        script: cd app && flutter build appbundle --release
      - name: Build release APK
        script: cd app && flutter build apk --release
    artifacts:
      - **/outputs/**/*.aab
      - **/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  ios-build:
    name: iOS Build (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        provisioning_profiles:
          - vaultell_appstore
        certificates:
          - Vaultell
      groups:
        - appstore_credentials
    scripts:
      - name: Get packages
        script: cd app && flutter pub get
      - name: Set up code signing on Xcode project
        script: cd app && xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build iOS release
        script: cd app && flutter build ipa --release
    artifacts:
      - **/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

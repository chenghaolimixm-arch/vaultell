workflows:
  android-build:
    name: Android Build (AAB + APK)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android_signing
    scripts:
      - name: Set up Android release signing
        script: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not set."
            echo "Configure the 'android_signing' environment group with:"
            echo "  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi
          # Gradle reads key.properties from the android root project dir, and
          # resolves storeFile relative to the app module dir (android/app).
          cd app/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > key.properties
          echo "Release signing configured:"
          echo "  key.properties -> $(pwd)/key.properties"
          echo "  keystore       -> $(pwd)/app/keystore.jks"
      - name: Get packages
        script: cd app && flutter pub get
      - name: Build release AAB
        script: cd app && flutter build appbundle --release
      - name: Build release APK
        script: cd app && flutter build apk --release
    artifacts:
      - '**/outputs/**/*.aab'
      - '**/outputs/**/*.apk'

  ios-build:
    name: iOS Build (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      ios_signing:
        provisioning_profiles:
          - vaultell_appstore
        certificates:
          - Vaultell
      groups:
        - appstore_credentials
    scripts:
      - name: Get packages
        script: cd app && flutter pub get
      - name: Set up code signing on Xcode project
        script: cd app && xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build iOS release
        script: cd app && flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - '**/*.ipa'
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
